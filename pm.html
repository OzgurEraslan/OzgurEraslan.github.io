<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Password Manager</title>
</head>

<body>
    <style>
        body {
            font-family: Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
            font-size: 14px;
            line-height: 1.42857;
            color: #3e3f3a;
            background-color: #fff;
            margin: 0;
        }
        input {
            line-height: normal;
        }
        * {
            box-sizing: border-box;
        }
        ::after,
        ::before {
            box-sizing: border-box;
        }
        hr {
            margin-top: 20px;
            border-color: #f8f5f0;
            border-style: solid none none;
            border-width: 1px 0 0;
        }
        h3 {
            font-size: 24px;
        }
        h4 {
            font-size: 18px;
            height: 32px;
        }
        button,
        input {
            color: inherit;
            font: inherit;
            margin: 0;
        }
        button {
            overflow: visible;
        }
        button {
            text-transform: none;
        }
        label {
            display: inline-block;
            max-width: 100%;
            margin-bottom: 5px;
            font-weight: 700;
        }
        .text-center {
            text-align: center;
        }
        .form-control {
            display: block;
            width: 100%;
            height: 46px;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.42857;
            color: #3e3f3a;
            background-color: #fff;
            background-image: none;
            border: 1px solid #dfd7ca;
            border-radius: 4px;
            box-shadow: rgba(0,0,0,.075) 0 1px 1px inset;
            transition: border-color 0.15s ease-in-out 0s,box-shadow 0.15s ease-in-out 0s;
        }
        .form-control:focus {
            border-color: transparent;
            outline: currentcolor none 0;
            box-shadow: rgba(0,0,0,.075) 0 1px 1px inset,rgba(0,0,0,.6) 0 0 8px;
        }
        .form-control::placeholder {
            color: #dfd7ca;
            opacity: 1;
        }
        .form-control::-webkit-input-placeholder {
            color: #dfd7ca;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn {
            display: inline-block;
            margin-bottom: 0;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            touch-action: manipulation;
            cursor: pointer;
            background-image: none;
            border: 0;
            border-bottom: 3px solid #ccc;
            white-space: nowrap;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.42857;
            border-radius: 4px;
            user-select: none;
        }
        .btn:active.focus,
        .btn:active:focus,
        .btn:focus {
            outline: currentcolor dotted thin;
            outline-offset: -2px;
        }
        .btn:focus,
        .btn:hover {
            color: #000;
            text-decoration: none;
        }
        .btn:active {
            outline: currentcolor none 0;
            background-image: none;
            box-shadow: rgba(0,0,0,.125) 0 3px 5px inset;
        }
        .btn[disabled] {
            cursor: not-allowed;
            opacity: 0.65;
            box-shadow: none;
        }
        .back {
            background: #2a2a2e none repeat scroll 0 0;
            width: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
        }
        .div-center {
            width: 500px;
            height: 400px;
            background-color: #fff;
            position: absolute;
            inset: 0;
            margin: auto;
            max-width: 100%;
            max-height: 100%;
            overflow: auto;
            padding: 1em 2em;
            border-bottom: 6px solid #ccc;
            display: table;
            border-radius: 16px;
        }
        div.content {
            display: table-cell;
            vertical-align: middle;
        }
        .unselectable {
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .lds-dual-ring {
            display: inline-block;
            width: 32px;
            height: 32px;
        }
        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 6px solid #3e3f3a;
            border-color: #3e3f3a transparent #3e3f3a transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }
        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    <div class="back">
        <div class="div-center">
            <div class="content">
                <h3>Password Manager</h3>
                <hr>
                <div class="form-group">
                    <label class="unselectable" for="exampleInputEmail1" onclick="revealMasterKey()">Master Key</label>
                    <input type="password" class="form-control" id="key">
                </div>
                <div class="form-group">
                    <label class="unselectable" for="exampleInputPassword1">Content</label>
                    <input type="text" class="form-control" id="content">
                </div>
                <button id="showResult" class="btn" onclick="updatePassword();" style="width: 100%; float: center;">Generate password</button>
                <hr>
                <h4 id="resultBox" class="text-center" style="font-family:'Lucida Console', monospace;">
                    <span id="result" style="cursor: pointer; min-width: 192px; display:inline-block;" draggable="true" ondragstart="drag(event)" onclick="toggleText()" hidden=""></span>
                    <span id="copyToClipboard" style="margin-left: 32px; font-size: 24px; cursor: pointer;" draggable="true" onclick="copyPassword()" hidden="">📋</span>
                </h4>
                <hr>
            </div>
        </div>
    </div>

    <script>
        let isIcon = true;
        let resultPassword = "";
        let masterKeyVisibility = false;
        function drag(event) {
          event.dataTransfer.setData("text/plain", resultPassword);
        }
        
        function toggleText() {
          const copyIcon = document.getElementById('copyToClipboard');
          copyIcon.hidden = false;
          const dragIcon = document.getElementById('result');
          isIcon = !isIcon;
          dragIcon.innerText = isIcon ? 'PASSWORD' : resultPassword;
        }
        
        async function digestMessage(key, content) {
          var hashBuffer = new TextEncoder().encode(key + content);
          for (var i = 0; i < 0xFFFF; ++i) {
            hashBuffer = await crypto.subtle.digest('SHA-512', hashBuffer);
          }
          hashBuffer = new Uint8Array(hashBuffer);
        
          var charMap = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNOPQRSTUVWXYZ23456789!#$%&()*+,-./:;<=>?@[]^_{}~';
          var base = charMap.length;
        
          let integerValue = 0n;
          for (let i = 0; i < hashBuffer.length; ++i) {
              integerValue = (integerValue << 8n) | BigInt(hashBuffer[i]);
          }
        
          let result = '';
          while (integerValue > 0n) {
              const remainder = integerValue % BigInt(base);
              integerValue = integerValue / BigInt(base);
              result = result + charMap[Number(remainder)];
          }
          result = result.slice(0, 22);
          resultPassword = result;
          return result;
        }
        
        function updatePassword() {
          function successCallback(result) {
            isIcon = false;
            toggleText();
          }
        
          function failureCallback(error) {
            document.getElementById('result').innerHTML = 'ERROR: ' + error;
          }
        
          document.getElementById('result').hidden = false;
          document.getElementById('copyToClipboard').hidden = true;
          document.getElementById('result').innerHTML = "<div class='lds-dual-ring'></div>";
          const promise = digestMessage(document.getElementById('key').value, document.getElementById('content').value);
          const promise2 = promise.then(successCallback, failureCallback);
        }
        
        function copyPassword() {
          navigator.clipboard.writeText(resultPassword);
        }
        
        function revealMasterKey() {
          masterKeyVisibility = !masterKeyVisibility;
          var x = document.getElementById('key');
          if (masterKeyVisibility) {
            x.type = "text";
          } else {
            x.type = "password";
          }
        }
    </script>

</body>

</html>
